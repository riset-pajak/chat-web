[project]
name = "chat-web"
version = "0.1.0"
description = "FastAPI service providing REST API + Web Chat UI for RisetPajak"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "jinja2>=3.1",         # templating for web UI
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
]

[project.scripts]
chat-web = "chatweb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatweb"]
